name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# صلاحيات البناء نظرة فقط، وصلاحيات النشر تُمنح صراحة
permissions:
  contents: read
  pages: write
  id-token: write

# يمنع تشغيل نشرين في نفس الوقت على نفس الموقع
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # التثبيت من ملف القفل الحالي دون تعديله
      - name: Install dependencies
        run: npm ci

      # يُشتق رابط الموقع والمسار من المستودع الفعلي وقت النشر
      # ويمكن تجاوزهما بمتغيرَي SITE_URL و BASE_PATH في إعدادات المستودع
      - name: Build
        run: npm run build
        env:
          SITE: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
